version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: textile_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ***REDACTED***
      MYSQL_DATABASE: textile_quality_db
      MYSQL_USER: textile_user
      MYSQL_PASSWORD: ***REDACTED***
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p***REDACTED***']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: astrid_quality_app
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      SECRET_KEY: ***REDACTED***
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_USER: textile_user
      MYSQL_PASSWORD: ***REDACTED***
      MYSQL_DATABASE: textile_quality_db
      CAMERA_INDEX: '0'
    volumes:
      - ./static/captures:/app/static/captures
      - ./static/results:/app/static/results
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
