{% extends "base.html" %} {% block content %}
<header class="page-header">
  <div>
    <h1>Inspección en tiempo real</h1>
    <p>Captura, análisis y registro individual de prendas</p>
  </div>
  <span id="inspection-camera-status" class="live-badge" role="status" aria-live="polite">● Comprobando cámara</span>
</header>
<style>
  /* Vista de monitoreo: solo muestra el video, sin controles ni resultados. */
  .inspection-live-monitor {
    width: 100%;
    min-width: 0;
  }
  .inspection-live-monitor .live-camera {
    width: 100%;
    height: min(70vh, 740px);
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0;
  }
  .inspection-live-monitor .live-camera img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  @media (max-width: 700px) {
    .inspection-live-monitor .live-camera {
      height: 53vh;
      min-height: 220px;
    }
  }
</style>
<section class="inspection-live-monitor">
  <article class="card">
    <h2>C?mara en vivo</h2>
    <div class="live-camera">
      <img src="{{ url_for('video_feed') }}" alt="Vista en directo de las prendas en la estaci?n" />
      <div class="camera-label">Monitor de estaci?n ? Solo visualizaci?n</div>
    </div>
  </article>
</section>
<script>
  (() => {
    const indicador = document.getElementById('inspection-camera-status');
    if (!indicador) return;

    const actualizar = (texto, color) => {
      indicador.textContent = '● ' + texto;
      indicador.style.color = color;
    };

    const consultar = async () => {
      try {
        const respuesta = await fetch("{{ url_for('camera_status_api') }}", {
          cache: 'no-store', credentials: 'same-origin'
        });
        if (!respuesta.ok) throw new Error('Estado no disponible');
        const estado = await respuesta.json();
        if (estado.connected) {
          actualizar('Cámara conectada', '#00d17b');
        } else if (estado.reconnecting || estado.state === 'STALE') {
          actualizar('Reconectando cámara', '#ffc36e');
        } else {
          actualizar('Cámara desconectada', '#ff8585');
        }
      } catch (_) {
        actualizar('Estado no disponible', '#ff8585');
      }
    };
    consultar();
    setInterval(consultar, 4000);
  })();
</script>
{% endblock %}
